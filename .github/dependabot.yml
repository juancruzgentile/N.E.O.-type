version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # no adopta versiones recién publicadas: da tiempo a detectar paquetes comprometidos
    cooldown:
      default-days: 7
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
