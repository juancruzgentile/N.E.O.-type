name: CI

on:
  push:
    branches: [main]
  pull_request:

# el token del workflow solo puede leer el repositorio
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # versión fija: Playwright 1.56 no instala el navegador en ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # .npmrc define ignore-scripts=true: ninguna dependencia ejecuta código al instalarse
      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=moderate
      - name: Firmas y procedencia de los paquetes
        run: npm audit signatures
      - run: npm run build
      - run: npm run check
      - name: Tests de lógica
        run: npm run test:logic
      - name: Tests de regresión
        run: npm run test:regression
      - name: Tests de seguridad
        run: npm run test:security
      - name: Navegador para las pruebas e2e
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Pruebas en navegador
        run: npm run test:e2e

  ejemplos:
    # compila y prueba los proyectos, y revisa la sintaxis de los ejemplos de la Biblioteca,
    # con la herramienta real de cada lenguaje
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # si falta alguna herramienta, falla en vez de saltear
      EJEMPLOS_ESTRICTO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Rust con rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: npm ci
      - name: Paquetes de Python para las pruebas (fijados con hash)
        run: "python -m pip install --require-hashes --only-binary=:all: -r scripts/requisitos-pruebas.txt"
      - name: Sintaxis de los ejemplos de la Biblioteca
        run: npm run test:examples
      - name: Los proyectos compilan y funcionan
        run: npm run test:projects
